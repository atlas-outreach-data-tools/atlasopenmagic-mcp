name: Build and publish to PyPI

# Same flow as atlasopenmagic: creating a GitHub release publishes to PyPI.
on:
  release:
    types:
      - created

jobs:
  build:
    name: Build and Publish to PyPI
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/atlasopenmagic-mcp

    permissions:
      id-token: write

    env:
      MATTERMOST_WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}

    steps:
    - uses: actions/checkout@v4

    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v5

    - name: Build a sdist and wheel
      run: |
        set -eux

        uvx --from build pyproject-build

    - name: Validate package structure with twine
      run: uvx twine check --strict dist/*

    - name: Publish distribution to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true

    - name: Notify Mattermost of release
      if: success() && env.MATTERMOST_WEBHOOK_URL != ''
      run: |
        set -e
        http_status=$(curl -s -w "%{http_code}" -o /tmp/mm_response.txt -X POST -H 'Content-Type: application/json' -d '{
          "text": "#### :rocket: *New atlasopenmagic-mcp release published!*\n\nVersion: ${{ github.event.release.tag_name }}\nRepository: https://github.com/${{ github.repository }}\n\nView on PyPI: https://pypi.org/project/atlasopenmagic-mcp/\nChangelog: ${{ github.event.release.html_url }}"
        }' "$MATTERMOST_WEBHOOK_URL")

        if [ "$http_status" -lt 200 ] || [ "$http_status" -ge 300 ]; then
          echo "Error: Failed to send notification to Mattermost. HTTP status: $http_status"
          cat /tmp/mm_response.txt
          exit 1
        else
          echo "Notification sent successfully. HTTP status: $http_status"
        fi

  sbom:
    name: Attach CycloneDX SBOM to the release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Install the latest version of uv
      uses: astral-sh/setup-uv@v5

    - name: Generate and upload SBOM
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -eux
        uv venv
        uv pip install . cyclonedx-bom
        uv run cyclonedx-py environment --of JSON -o sbom.cdx.json
        gh release upload "${{ github.event.release.tag_name }}" sbom.cdx.json
